name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool libltdl-dev pkg-config zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev autopoint gettext
          python -m pip install buildozer==1.6.0 setuptools 'cython==0.29.34' openpyxl==3.1.5
      - name: Test learning engine
        run: python -m unittest discover -s tests -v
      - name: Build debug APK
        run: |
          set -o pipefail
          if buildozer -v android debug > build.log 2>&1; then
            tail -n 30 build.log
          else
            tail -n 160 build.log
            exit 1
          fi
      - name: Verify APK integrity
        run: |
          python3 - <<'PYVERIFY'
          from pathlib import Path
          from zipfile import ZipFile, BadZipFile
          apks = list(Path('bin').glob('*.apk'))
          if not apks:
              raise SystemExit('No APK found in bin/')
          for apk in apks:
              print(f'Checking {apk} ({apk.stat().st_size:,} bytes)')
              with ZipFile(apk, 'r') as z:
                  assert 'AndroidManifest.xml' in z.namelist(), 'Missing AndroidManifest.xml'
                  damaged = z.testzip()
                  assert damaged is None, f'Corrupt APK entry: {damaged}'
              print('APK ZIP integrity OK')
          PYVERIFY
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hoc-Tieng-Trung-APK
          path: bin/*.apk
          if-no-files-found: error
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-build-log
          path: build.log
          if-no-files-found: ignore
